<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Vane Agent</title>
	<style>
		:root {
			color-scheme: dark;
			--bg: var(--vscode-sideBar-background, #1e1e1e);
			--fg: var(--vscode-foreground, #ccc);
			--muted: var(--vscode-descriptionForeground, #888);
			--accent: var(--vscode-button-background, #0e639c);
			--accent-fg: var(--vscode-button-foreground, #fff);
			--input: var(--vscode-input-background, #2a2a2a);
			--border: var(--vscode-panel-border, #333);
			--user: rgba(14, 99, 156, 0.25);
			--tool: rgba(255, 255, 255, 0.04);
		}
		* { box-sizing: border-box; }
		html, body {
			height: 100%; margin: 0;
			font-family: var(--vscode-font-family, -apple-system, system-ui, sans-serif);
			font-size: 13px; color: var(--fg); background: var(--bg);
		}
		.wrap { display: flex; flex-direction: column; height: 100%; }
		header {
			padding: 10px 12px 8px;
			border-bottom: 1px solid var(--border);
		}
		header h1 {
			margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.02em;
		}
		header .meta { margin-top: 4px; color: var(--muted); font-size: 11px; }
		#log {
			flex: 1; overflow-y: auto; padding: 12px;
			display: flex; flex-direction: column; gap: 10px;
		}
		.msg {
			padding: 8px 10px; border-radius: 8px; line-height: 1.45;
			white-space: pre-wrap; word-break: break-word;
		}
		.msg.user { background: var(--user); align-self: flex-end; max-width: 95%; }
		.msg.assistant { background: transparent; border: 1px solid var(--border); }
		.msg.tool {
			background: var(--tool); color: var(--muted); font-size: 11px;
			font-family: var(--vscode-editor-font-family, ui-monospace, monospace);
		}
		.msg.error { border: 1px solid #c44; color: #f88; }
		.msg.status { color: var(--muted); font-size: 11px; }
		footer {
			border-top: 1px solid var(--border);
			padding: 8px; display: flex; flex-direction: column; gap: 6px;
		}
		textarea {
			width: 100%; min-height: 64px; resize: vertical;
			background: var(--input); color: var(--fg);
			border: 1px solid var(--border); border-radius: 8px;
			padding: 8px; font: inherit;
		}
		textarea:focus { outline: 1px solid var(--accent); }
		.row { display: flex; gap: 6px; }
		button {
			flex: 1; border: none; border-radius: 6px; padding: 7px 10px;
			background: var(--accent); color: var(--accent-fg); cursor: pointer; font: inherit;
		}
		button.secondary { background: transparent; border: 1px solid var(--border); color: var(--fg); }
		button:disabled { opacity: 0.5; cursor: default; }
		.empty { color: var(--muted); font-size: 12px; line-height: 1.5; padding: 8px 4px; }
	</style>
</head>
<body>
	<div class="wrap">
		<header>
			<h1>Vane Agent</h1>
			<div class="meta" id="meta">Loading...</div>
		</header>
		<div id="log">
			<div class="empty" id="empty">
				Tell Vane what you want in plain English. It can look at your project files and suggest edits (you always approve writes).
				<br/><br/>
				Try: "Explain this project simply" or "Help me add a basic token contract."
				<br/><br/>
				Tip: open Home first if you do not have a project folder yet.
			</div>
		</div>
		<footer>
			<textarea id="input" placeholder="What do you want to build or understand?"></textarea>
			<div class="row">
				<button class="secondary" id="keyBtn" type="button">API key</button>
				<button class="secondary" id="newBtn" type="button">New</button>
				<button id="sendBtn" type="button">Send</button>
			</div>
		</footer>
	</div>
	<script>
		const vscode = acquireVsCodeApi();
		const log = document.getElementById('log');
		const empty = document.getElementById('empty');
		const input = document.getElementById('input');
		const meta = document.getElementById('meta');
		const sendBtn = document.getElementById('sendBtn');
		let assistantEl = null;
		let busy = false;

		function hideEmpty() { if (empty) empty.style.display = 'none'; }

		function add(cls, text) {
			hideEmpty();
			const el = document.createElement('div');
			el.className = 'msg ' + cls;
			el.textContent = text;
			log.appendChild(el);
			log.scrollTop = log.scrollHeight;
			return el;
		}

		function setBusy(v) {
			busy = v;
			sendBtn.disabled = v;
			sendBtn.textContent = v ? '...' : 'Send';
		}

		window.addEventListener('message', (e) => {
			const m = e.data;
			if (m.type === 'config') {
				meta.textContent = (m.hasKey ? 'Ready' : 'Add an API key to chat') +
					' · ' + m.provider + '/' + m.model + ' · ' + (m.modeLabel || m.mode);
				return;
			}
			if (m.type === 'cleared') {
				log.innerHTML = '';
				log.appendChild(empty);
				empty.style.display = 'block';
				return;
			}
			if (m.type === 'user') { add('user', m.text); return; }
			if (m.type === 'assistant_start') { assistantEl = add('assistant', ''); return; }
			if (m.type === 'delta') {
				if (!assistantEl) assistantEl = add('assistant', '');
				assistantEl.textContent += m.text;
				log.scrollTop = log.scrollHeight;
				return;
			}
			if (m.type === 'final') {
				if (!assistantEl) assistantEl = add('assistant', '');
				if (m.text && !assistantEl.textContent) assistantEl.textContent = m.text;
				assistantEl = null;
				return;
			}
			if (m.type === 'status') { add('status', m.message); return; }
			if (m.type === 'tool_start') {
				add('tool', '-> ' + m.name + (m.args && m.args.path ? ' ' + m.args.path : m.args && m.args.command ? ' $ ' + m.args.command : ''));
				return;
			}
			if (m.type === 'tool_end') {
				add('tool', 'OK ' + (m.summary || m.name));
				return;
			}
			if (m.type === 'error') { add('error', m.message); return; }
			if (m.type === 'idle') { setBusy(false); }
		});

		function send() {
			const text = input.value.trim();
			if (!text || busy) return;
			setBusy(true);
			input.value = '';
			vscode.postMessage({ type: 'chat', text });
		}

		sendBtn.addEventListener('click', send);
		document.getElementById('keyBtn').addEventListener('click', () => vscode.postMessage({ type: 'setKey' }));
		document.getElementById('newBtn').addEventListener('click', () => vscode.postMessage({ type: 'newChat' }));
		input.addEventListener('keydown', (ev) => {
			if (ev.key === 'Enter' && (ev.metaKey || ev.ctrlKey)) {
				ev.preventDefault();
				send();
			}
		});

		vscode.postMessage({ type: 'ready' });
	</script>
</body>
</html>
